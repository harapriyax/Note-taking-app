service: noteflow-api

frameworkVersion: '3'

custom:
  attachmentsBucket: noteflow-attachments-${self:provider.stage}-${aws:accountId}

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'live'}
  memorySize: 256
  timeout: 25
  environment:
    STAGE: ${self:provider.stage}
    USERS_TABLE: ${self:service}-users-${self:provider.stage}
    NOTES_TABLE: ${self:service}-notes-${self:provider.stage}
    TASKS_TABLE: ${self:service}-tasks-${self:provider.stage}
    CATEGORIES_TABLE: ${self:service}-categories-${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    IDENTITY_POOL_ID: !Ref CognitoIdentityPool
    ATTACHMENTS_BUCKET: ${self:custom.attachmentsBucket}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
            - Fn::Join: ['/', [Fn::GetAtt: [UsersTable, Arn], 'index', '*']]
            - Fn::GetAtt: [NotesTable, Arn]
            - Fn::Join: ['/', [Fn::GetAtt: [NotesTable, Arn], 'index', '*']]
            - Fn::GetAtt: [TasksTable, Arn]
            - Fn::GetAtt: [CategoriesTable, Arn]
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:ListUsers
          Resource:
            - Fn::Sub: "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:HeadObject
          Resource:
            - !Join ['', ['arn:aws:s3:::', '${self:custom.attachmentsBucket}', '/*']]

functions:
  # ──── Auth (PROTECTED — IAM authorizer) ────
  authMe:
    handler: src/handlers/auth.getMe
    events:
      - http:
          path: /api/auth/me
          method: get
          cors: true
          authorizer: aws_iam

  authProfile:
    handler: src/handlers/auth.updateProfile
    events:
      - http:
          path: /api/auth/profile
          method: put
          cors: true
          authorizer: aws_iam

  # ──── PostConfirmation Trigger (invoked by CognitoUserPool LambdaConfig) ────
  postConfirmation:
    handler: src/handlers/auth.postConfirmation

  # ──── Uploads (PROTECTED) ────
  uploadsPresignedUrl:
    handler: src/handlers/uploads.getPresignedUrl
    events:
      - http:
          path: /api/uploads/presigned-url
          method: post
          cors: true
          authorizer: aws_iam

  # ──── Notes (PROTECTED) ────
  notesList:
    handler: src/handlers/notes.list
    events:
      - http:
          path: /api/notes
          method: get
          cors: true
          authorizer: aws_iam

  notesSearch:
    handler: src/handlers/notes.search
    events:
      - http:
          path: /api/notes/search
          method: get
          cors: true
          authorizer: aws_iam

  notesStats:
    handler: src/handlers/notes.stats
    events:
      - http:
          path: /api/notes/stats
          method: get
          cors: true
          authorizer: aws_iam

  notesGetById:
    handler: src/handlers/notes.getById
    events:
      - http:
          path: /api/notes/{id}
          method: get
          cors: true
          authorizer: aws_iam

  notesCreate:
    handler: src/handlers/notes.create
    events:
      - http:
          path: /api/notes
          method: post
          cors: true
          authorizer: aws_iam

  notesUpdate:
    handler: src/handlers/notes.update
    events:
      - http:
          path: /api/notes/{id}
          method: put
          cors: true
          authorizer: aws_iam

  notesTogglePin:
    handler: src/handlers/notes.togglePin
    events:
      - http:
          path: /api/notes/{id}/pin
          method: put
          cors: true
          authorizer: aws_iam

  notesToggleFavorite:
    handler: src/handlers/notes.toggleFavorite
    events:
      - http:
          path: /api/notes/{id}/favorite
          method: put
          cors: true
          authorizer: aws_iam

  notesTrash:
    handler: src/handlers/notes.trash
    events:
      - http:
          path: /api/notes/{id}/trash
          method: put
          cors: true
          authorizer: aws_iam

  notesRestore:
    handler: src/handlers/notes.restore
    events:
      - http:
          path: /api/notes/{id}/restore
          method: put
          cors: true
          authorizer: aws_iam

  notesDelete:
    handler: src/handlers/notes.remove
    events:
      - http:
          path: /api/notes/{id}
          method: delete
          cors: true
          authorizer: aws_iam

  # ──── Tasks (PROTECTED) ────
  tasksList:
    handler: src/handlers/tasks.list
    events:
      - http:
          path: /api/tasks
          method: get
          cors: true
          authorizer: aws_iam

  tasksCreate:
    handler: src/handlers/tasks.create
    events:
      - http:
          path: /api/tasks
          method: post
          cors: true
          authorizer: aws_iam

  tasksUpdate:
    handler: src/handlers/tasks.update
    events:
      - http:
          path: /api/tasks/{id}
          method: put
          cors: true
          authorizer: aws_iam

  tasksToggle:
    handler: src/handlers/tasks.toggle
    events:
      - http:
          path: /api/tasks/{id}/toggle
          method: put
          cors: true
          authorizer: aws_iam

  tasksDelete:
    handler: src/handlers/tasks.remove
    events:
      - http:
          path: /api/tasks/{id}
          method: delete
          cors: true
          authorizer: aws_iam

  # ──── Categories (PROTECTED) ────
  categoriesList:
    handler: src/handlers/categories.list
    events:
      - http:
          path: /api/categories
          method: get
          cors: true
          authorizer: aws_iam

  categoriesCreate:
    handler: src/handlers/categories.create
    events:
      - http:
          path: /api/categories
          method: post
          cors: true
          authorizer: aws_iam

  categoriesDelete:
    handler: src/handlers/categories.remove
    events:
      - http:
          path: /api/categories/{id}
          method: delete
          cors: true
          authorizer: aws_iam

  # ──── Health (PUBLIC) ────
  health:
    handler: src/handlers/health.check
    events:
      - http:
          path: /api/health
          method: get
          cors: true

resources:
  Resources:
    # ──── Cognito User Pool ────
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: noteflow-users-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
        Schema:
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: false
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
          EmailSubject: "Your NoteFlow Verification Code"
          EmailMessage: "Your verification code for NoteFlow is {####}. Enter this code to verify your account."

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: noteflow-web-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED

    # ──── Cognito Identity Pool (Federated Identities) ────
    CognitoIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: noteflow_identity_pool_${self:provider.stage}
        AllowUnauthenticatedIdentities: false
        CognitoIdentityProviders:
          - ClientId: !Ref CognitoUserPoolClient
            ProviderName:
              Fn::GetAtt: [CognitoUserPool, ProviderName]

    # ──── IAM Role for Authenticated Users ────
    CognitoAuthRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: noteflow-cognito-auth-${self:provider.stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Federated: cognito-identity.amazonaws.com
              Action: sts:AssumeRoleWithWebIdentity
              Condition:
                StringEquals:
                  cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
                ForAnyValue:StringLike:
                  cognito-identity.amazonaws.com:amr: authenticated
        Policies:
          - PolicyName: CognitoAuthPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - execute-api:Invoke
                  Resource:
                    - Fn::Sub: "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*"

    # ──── Attach Roles to Identity Pool ────
    IdentityPoolRoleAttachment:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId: !Ref CognitoIdentityPool
        Roles:
          authenticated: !GetAtt CognitoAuthRole.Arn



    # ──── S3 Buckets ────
    AttachmentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.attachmentsBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - HEAD
              AllowedOrigins:
                - '*'
              MaxAge: 3600

    AttachmentsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref AttachmentsBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: '*'
              Action:
                - s3:GetObject
              Resource:
                - !Join ['', ['arn:aws:s3:::', !Ref AttachmentsBucket, '/attachments/*']]

    # ──── DynamoDB Tables ────
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cognitoId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: cognitoId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    NotesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.NOTES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cognitoId
            AttributeType: S
          - AttributeName: noteId
            AttributeType: S
        KeySchema:
          - AttributeName: cognitoId
            KeyType: HASH
          - AttributeName: noteId
            KeyType: RANGE

    TasksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TASKS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cognitoId
            AttributeType: S
          - AttributeName: taskId
            AttributeType: S
        KeySchema:
          - AttributeName: cognitoId
            KeyType: HASH
          - AttributeName: taskId
            KeyType: RANGE

    CategoriesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CATEGORIES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cognitoId
            AttributeType: S
          - AttributeName: categoryId
            AttributeType: S
        KeySchema:
          - AttributeName: cognitoId
            KeyType: HASH
          - AttributeName: categoryId
            KeyType: RANGE

    # ──── CORS: Gateway Response for 4xx (needed for REST API IAM + CORS) ────
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId: !Ref ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId: !Ref ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  Outputs:
    ApiUrl:
      Description: URL of the REST API Gateway
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - !Ref ApiGatewayRestApi
            - '.execute-api.'
            - !Ref AWS::Region
            - '.amazonaws.com/'
            - ${self:provider.stage}
    UserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref CognitoUserPool
    UserPoolClientId:
      Description: Cognito User Pool Client ID
      Value: !Ref CognitoUserPoolClient
    IdentityPoolId:
      Description: Cognito Identity Pool ID
      Value: !Ref CognitoIdentityPool
    AttachmentsBucketName:
      Description: S3 Attachments Bucket Name
      Value: !Ref AttachmentsBucket
